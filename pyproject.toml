[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator and solver"
authors = [
    {name = "Lev Koelman", email = "lekoelma@student.codam.nl"},
    {name = "Francisco Luthra", email = "fluthra@student.codam.nl"}
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
]

[tool.poetry]
packages = [{ include = "mazegen" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pydantic (>=2.14.1,<3.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]
